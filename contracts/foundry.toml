[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# 실측 근거 (2026-07-27, https://sepolia-rpc.giwa.io/)
#   client        reth/v2.3.0
#   TSTORE/TLOAD  동작 확인  (Cancun)
#   MCOPY         동작 확인  (Cancun)
#   블록 헤더에 requestsHash 존재 → 노드는 Prague 세대. cancun을 하한으로 고정한다.
evm_version = "cancun"
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
# 14필드 DecisionData를 평면 튜플로 인코딩/디코딩하면 legacy 코드젠에서 stack too deep이 난다.
# 리졸버 onAttest도 같은 수의 필드를 읽으므로 via_ir을 켠다 (C1에서 확인).
via_ir = true

remappings = [
  "forge-std/=lib/forge-std/src/",
  "@ethereum-attestation-service/eas-contracts/=lib/eas-contracts/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

# 공유 벡터를 읽기 위해서만 프로젝트 밖 경로를 연다 (X1)
fs_permissions = [{access = "read", path = "../core/vectors"}]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
giwa_sepolia = "${GIWA_RPC_URL}"

[etherscan]
giwa_sepolia = {key = "any", url = "https://sepolia-explorer.giwa.io/api", chain = 91342}
